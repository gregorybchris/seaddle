<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1c4632" />

    <title>Seaddle — Seattle bike routes for new cyclists</title>
    <meta
      name="description"
      content="Over 300 miles of beginner to intermediate cycling routes around Seattle."
    />
    <!--
      The route a rider builds lives in the query string, so the same page is
      reachable under endless ?r= permutations and, because every path rewrites
      to this file, under any path at all. One canonical points the whole lot at
      the root rather than letting a crawler index someone's 32-mile loop as a
      page of its own.

      A search engine only. There is deliberately no `og:url` beside it: a chat
      app reads that as where the link goes, not merely as which page it is, so
      a route sent to a friend arrived as the bare map with the route stripped
      off it. Without one, the scraper takes the URL it was handed — which is
      the route — and Facebook does not read this tag as a substitute.
    -->
    <link rel="canonical" href="https://seaddle.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Seaddle" />
    <meta
      property="og:title"
      content="Seaddle — Seattle bike routes for new cyclists"
    />
    <meta
      property="og:description"
      content="Over 300 miles of beginner to intermediate cycling routes around Seattle."
    />
    <!--
      Absolute: a scraper reads this markup without a page to resolve against.

      The `v` is the card's own fingerprint, stamped by `pnpm og:build`. Every
      scraper caches the image against its URL and most offer no way to ask for
      it again — Facebook and LinkedIn have debuggers, WhatsApp and iMessage
      have nothing — so a redrawn card at the same address stays the old card
      for as long as their cache holds it. Hand-editing a version number would
      be the step forgotten precisely because the card is redrawn so rarely.
    -->
    <meta property="og:image" content="https://seaddle.com/og.png?v=14cbebb5" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Seaddle mark beside a map of ridable segments around Seattle, with one route picked out in orange."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Seaddle",
        "url": "https://seaddle.com/",
        "applicationCategory": "TravelApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript.",
        "isAccessibleForFree": true,
        "description": "A map of ridable segments around Seattle. A route is not stored but built: riders click their way from one junction to the next, and every segment carries its steepness, how protected it is, its surroundings, and its surface.",
        "areaServed": {
          "@type": "City",
          "name": "Seattle",
          "address": {
            "@type": "PostalAddress",
            "addressRegion": "WA",
            "addressCountry": "US"
          }
        }
      }
    </script>

    <script
      data-goatcounter="https://seaddle.goatcounter.com/count"
      async
      src="//gc.zgo.at/count.js"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      The map is drawn in the browser, so a crawler that does not run scripts
      finds an empty div and nothing to index. This says what the page is for
      the ones that do not render, and is never seen by anyone who does.
    -->
    <noscript>
      <h1>Seaddle — Seattle bike routes for new cyclists</h1>
      <p>
        Seaddle is a map of ridable segments around Seattle and the Eastside. A
        route is not stored but built: you pick a segment, then the segments
        that lead on from it, outward from wherever you are.
      </p>
      <p>
        Every segment carries how steep it is, how protected from traffic it is,
        what it is paved with, and what it is like to be on. Seaddle needs
        JavaScript to draw the map.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
